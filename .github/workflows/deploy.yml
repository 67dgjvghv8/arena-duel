name: Build & Deploy Arena

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Собираем Docker-образ
        run: docker build -f Dockerfile.prod -t arena-duel:${{ github.sha }} .

      - name: Проверяем запуск контейнера
        run: |
          docker run -d --name arena-test -p 8080:80 arena-duel:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/ > /dev/null || exit 1
          echo "Приложение работает"
          docker stop arena-test
          docker rm arena-test
